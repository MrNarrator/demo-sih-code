<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Twin — DC Cooling, Energy Harvesting & Water Recovery</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;font-family:'Inter',sans-serif;color:#e2e8f0}
canvas{display:block}
#hud{position:fixed;top:16px;left:16px;width:300px;background:rgba(15,23,42,.55);backdrop-filter:blur(14px);border:1px solid rgba(148,163,184,.25);border-radius:14px;padding:16px;box-shadow:0 8px 32px rgba(0,0,0,.4);z-index:10}
#hud h1{font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:.05em;color:#38bdf8;margin-bottom:10px}
.ctrl{margin-bottom:10px}
.ctrl label{display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-bottom:3px}
.ctrl span{color:#67e8f9;font-family:'Orbitron',sans-serif}
input[type=range]{width:100%;accent-color:#38bdf8}
#telemetry{margin-top:12px;border-top:1px solid rgba(148,163,184,.2);padding-top:10px;font-size:11px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
#telemetry div{background:rgba(255,255,255,.04);border-radius:8px;padding:6px 8px}
#telemetry b{display:block;font-family:'Orbitron',sans-serif;font-size:13px;color:#4ade80}
#camBar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(15,23,42,.55);backdrop-filter:blur(14px);border:1px solid rgba(148,163,184,.25);border-radius:12px;padding:8px;z-index:10;flex-wrap:wrap;max-width:90vw;justify-content:center}
#camBar button{background:transparent;border:1px solid rgba(148,163,184,.3);color:#cbd5e1;font-family:'Inter';font-size:11px;padding:7px 12px;border-radius:8px;cursor:pointer;transition:.2s}
#camBar button:hover,#camBar button.active{background:#38bdf8;color:#0f172a;border-color:#38bdf8}
.pin{position:absolute;transform:translate(-50%,-100%);background:rgba(15,23,42,.75);border:1px solid rgba(56,189,248,.4);border-radius:6px;padding:3px 8px;font-size:10px;color:#67e8f9;white-space:nowrap;pointer-events:none;font-family:'Orbitron',sans-serif}
#loading{position:fixed;inset:0;background:#0f172a;display:flex;align-items:center;justify-content:center;color:#38bdf8;font-family:'Orbitron';z-index:100;font-size:13px}
</style>
</head>
<body>
<div id="loading">INITIALIZING DIGITAL TWIN…</div>
<div id="hud">
<h1>SYSTEM CONTROL // v1.0</h1>
<div class="ctrl"><label>Intake Rate <span id="vIntake">1.2 L/m</span></label><input id="intake" type="range" min="0.2" max="2.5" step="0.1" value="1.2"></div>
<div class="ctrl"><label>Thermal Load <span id="vThermal">450 W</span></label><input id="thermal" type="range" min="100" max="1000" step="10" value="450"></div>
<div class="ctrl"><label>Acoustic Noise <span id="vAcoustic">85 dB</span></label><input id="acoustic" type="range" min="60" max="110" step="1" value="85"></div>
<div id="telemetry">
<div>Hydro Power<b id="tHydro">0 W</b></div>
<div>Piezo Power<b id="tPiezo">0 W</b></div>
<div>Filtration Load<b id="tFiltration">0 W</b></div>
<div>Net Offset<b id="tNet">0%</b></div>
</div>
</div>
<div id="camBar"></div>
<div id="labels"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* =========================================================
   DIGITAL TWIN — DATA CENTER COOLING / ENERGY / WATER RECOVERY
   Single-file Three.js r128 simulation. Sections are numbered
   to match the physical workflow of the prototype.
   ========================================================= */

// ---------- 0. CORE SCENE / RENDERER / CAMERA ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f172a);
scene.fog = new THREE.Fog(0x0f172a, 20, 60);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(14,10,16);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.85;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(2,3,0);
controls.maxDistance = 45; controls.minDistance = 3;
controls.maxPolarAngle = Math.PI*0.49;

// ---------- 0.1 LIGHTING RIG ----------
scene.add(new THREE.AmbientLight(0x8fa8c4, 1.2));
const key = new THREE.DirectionalLight(0xfff3e0, 3.5);
key.position.set(12,18,10); key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-24;key.shadow.camera.right=24;key.shadow.camera.top=24;key.shadow.camera.bottom=-24;
key.shadow.bias=-0.0005;
scene.add(key);
const fill = new THREE.DirectionalLight(0x93c5fd, 1.5); fill.position.set(-14,8,-6); scene.add(fill);
const rim = new THREE.DirectionalLight(0x67e8f9, 1.2); rim.position.set(0,10,-18); scene.add(rim);
const bounce = new THREE.HemisphereLight(0x1e293b, 0x0f172a, 0.6); scene.add(bounce);

// ---------- 0.2 STUDIO ENVIRONMENT ----------
const grid = new THREE.GridHelper(70,70,0x334155,0x1e293b); scene.add(grid);
const floorMat = new THREE.MeshStandardMaterial({color:0x1e293b, roughness:0.9, metalness:0.05});
const floor = new THREE.Mesh(new THREE.CircleGeometry(34,48), floorMat);
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const baseboard = new THREE.Mesh(new THREE.BoxGeometry(24,0.4,11), new THREE.MeshStandardMaterial({color:0x475569, roughness:0.8}));
baseboard.position.set(2,-0.2,0); baseboard.receiveShadow=true; scene.add(baseboard);
// wood trim strip
const woodTrim = new THREE.Mesh(new THREE.BoxGeometry(24,0.06,0.3), new THREE.MeshStandardMaterial({color:0x854d0e, roughness:0.7}));
woodTrim.position.set(2,0.02,5.3); scene.add(woodTrim);
const woodTrim2 = woodTrim.clone(); woodTrim2.position.z=-5.3; scene.add(woodTrim2);

// ---------- 0.3 MATERIAL LIBRARY ----------
const M = {
  metal: new THREE.MeshStandardMaterial({color:0x94a3b8, metalness:0.9, roughness:0.3}),
  darkMetal: new THREE.MeshStandardMaterial({color:0x334155, metalness:0.8, roughness:0.35}),
  copper: new THREE.MeshStandardMaterial({color:0xb87333, metalness:0.85, roughness:0.25}),
  cd: new THREE.MeshStandardMaterial({color:0xc0c0c8, metalness:1, roughness:0.12}),
  pvc: new THREE.MeshStandardMaterial({color:0xf1f5f9, roughness:0.5}),
  red: new THREE.MeshStandardMaterial({color:0xdc2626, roughness:0.6}),
  glass: new THREE.MeshPhysicalMaterial({color:0xbfe3f5, transmission:0.95, opacity:0.35, transparent:true, roughness:0.05, thickness:0.5, ior:1.4}),
  glassDark: new THREE.MeshPhysicalMaterial({color:0x7dd3fc, transmission:0.9, opacity:0.28, transparent:true, roughness:0.08, thickness:0.4, ior:1.4}),
  charcoal: new THREE.MeshStandardMaterial({color:0x1e1e1e, roughness:1}),
  membrane: new THREE.MeshStandardMaterial({color:0xf8fafc, roughness:0.4}),
  uvGlow: new THREE.MeshBasicMaterial({color:0x8b5cf6}),
  pcb: new THREE.MeshStandardMaterial({color:0x0f5132, roughness:0.7}),
  cap: new THREE.MeshStandardMaterial({color:0x1d4ed8, metalness:0.5, roughness:0.3}),
  wood: new THREE.MeshStandardMaterial({color:0x64748b, roughness:0.85}),
  bolt: new THREE.MeshStandardMaterial({color:0x475569, metalness:0.9, roughness:0.4}),
  brass: new THREE.MeshStandardMaterial({color:0xc9a227, metalness:0.8, roughness:0.3}),
  fanBlade: new THREE.MeshStandardMaterial({color:0x1e293b, roughness:0.5})
};

const group = {plant:new THREE.Group()}; scene.add(group.plant);
function grp(name,x,y,z){const g=new THREE.Group();g.position.set(x,y,z);group.plant.add(g);group[name]=g;return g;}
function bolts(parent,positions,r=0.04,h=0.06){positions.forEach(p=>{const b=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,8),M.bolt);b.position.set(...p);parent.add(b);});}
function pipe(points,color,radius=0.06){
  const curve = new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
  const geo = new THREE.TubeGeometry(curve,32,radius,8,false);
  const mat = new THREE.MeshStandardMaterial({color,metalness:0.6,roughness:0.4});
  const m = new THREE.Mesh(geo,mat); m.castShadow=true; scene.add(m); return m;
}

/* =========================================================
   1. FRESH WATER INTAKE — ELEVATED HEADER TANK
   ========================================================= */
grp('header',-8,7.5,0);
{
  const tank = new THREE.Mesh(new THREE.CylinderGeometry(1,1,1.6,28), M.glass); tank.castShadow=true; group.header.add(tank);
  const lid = new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.05,0.08,28), M.darkMetal); lid.position.y=0.84; group.header.add(lid);
  const inletPipe = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.6,10), M.metal); inletPipe.position.set(0,1.1,0); group.header.add(inletPipe);
  const frame = new THREE.Mesh(new THREE.BoxGeometry(2.4,0.2,2.4), M.metal); frame.position.y=-1; frame.castShadow=true; group.header.add(frame);
  const legPos = [[1,-1],[-1,-1],[1,1],[-1,1]];
  legPos.forEach(([x,z])=>{const l=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,7),M.metal); l.position.set(x,-4.5,z); l.castShadow=true; group.header.add(l);
    const cross = new THREE.Mesh(new THREE.BoxGeometry(0.04,0.04,2), M.metal); cross.position.set(x,-3,0); group.header.add(cross);
  });
  const valve = new THREE.Mesh(new THREE.SphereGeometry(0.12,12,12), M.brass); valve.position.set(0,-0.9,0); group.header.add(valve);
  const gauge = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,0.06,16), M.metal); gauge.rotation.x=Math.PI/2; gauge.position.set(1.05,0.2,0); group.header.add(gauge);
  bolts(group.header,[[0.9,-0.9,0.9],[-0.9,-0.9,0.9],[0.9,-0.9,-0.9],[-0.9,-0.9,-0.9]]);
}
pipe([[-8,6.5,0],[-8,5.8,0.6],[-8,5.6,0]],0x94a3b8,0.07);

/* =========================================================
   WATER WHEEL FACTORY (used by cascades 1 & 2)
   ========================================================= */
function makeWheel(radius, color, detailed=true){
  const w = new THREE.Group();
  const disc1 = new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,0.06,28), M.cd); disc1.rotation.x=Math.PI/2; disc1.position.z=0.2; disc1.castShadow=true; w.add(disc1);
  const disc2 = disc1.clone(); disc2.position.z=-0.2; w.add(disc2);
  // inner hub detail typical of a recycled CD
  const hub1 = new THREE.Mesh(new THREE.RingGeometry(radius*0.15,radius*0.22,20), new THREE.MeshStandardMaterial({color:0x0ea5e9,metalness:0.6,roughness:0.3,side:THREE.DoubleSide}));
  hub1.position.z=0.231; w.add(hub1);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,1.0,12), M.metal); shaft.rotation.x=Math.PI/2; shaft.castShadow=true; w.add(shaft);
  for(let i=0;i<12;i++){
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.15,0.38), new THREE.MeshStandardMaterial({color,roughness:0.55}));
    const a = (i/12)*Math.PI*2;
    p.position.set(Math.cos(a)*radius, Math.sin(a)*radius, 0);
    p.rotation.z = a; p.castShadow=true;
    w.add(p);
    if(detailed){
      const rivet = new THREE.Mesh(new THREE.SphereGeometry(0.02,6,6), M.bolt);
      rivet.position.set(Math.cos(a)*radius*0.85, Math.sin(a)*radius*0.85, 0.05);
      w.add(rivet);
    }
  }
  // KP08 pillow block bearings
  const bearGeo = new THREE.BoxGeometry(0.26,0.26,0.22);
  const bearL = new THREE.Mesh(bearGeo, M.darkMetal); bearL.position.z=0.55; bearL.castShadow=true; w.add(bearL);
  const bearR = bearL.clone(); bearR.position.z=-0.55; w.add(bearR);
  bolts(w,[[0.1,0.1,0.55],[-0.1,0.1,0.55],[0.1,-0.1,0.55],[-0.1,-0.1,0.55]]);
  return w;
}
function toyMotor(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,0.42,14), M.darkMetal); body.rotation.z=Math.PI/2; g.add(body);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.1,0.06,14), M.metal); cap.rotation.z=Math.PI/2; cap.position.x=0.24; g.add(cap);
  return g;
}

/* =========================================================
   2. CASCADE 1 — 3-TIER FRESHWATER MICRO-HYDRO TOWER
   ========================================================= */
grp('cascade1',-8,5,0);
const c1wheels=[];
for(let i=0;i<3;i++){
  const tierY = -i*2.2;
  const w = makeWheel(0.7, 0xf1f5f9); w.position.set(0,tierY,0); group.cascade1.add(w); c1wheels.push(w);
  const motor = toyMotor(); motor.position.set(0.75,tierY,0.75); group.cascade1.add(motor);
  // catch tray beneath each wheel
  const tray = new THREE.Mesh(new THREE.CylinderGeometry(0.9,0.9,0.08,20,1,true), new THREE.MeshStandardMaterial({color:0x475569,side:THREE.DoubleSide,roughness:0.6}));
  tray.position.set(0,tierY-0.75,0); group.cascade1.add(tray);
  // chute funneling to next tier
  if(i<2){
    const chute = new THREE.Mesh(new THREE.ConeGeometry(0.35,0.5,12,1,true), new THREE.MeshStandardMaterial({color:0x64748b,side:THREE.DoubleSide}));
    chute.position.set(0,tierY-0.9,0); group.cascade1.add(chute);
  }
}
const towerBarGeo1 = new THREE.BoxGeometry(0.08,7,0.08);
[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([x,z])=>{const t=new THREE.Mesh(towerBarGeo1,M.metal); t.position.set(x,-3,z); t.castShadow=true; group.cascade1.add(t);});
// horizontal cross braces
for(let i=0;i<4;i++){
  const cy = -0.5-i*1.8;
  const cb = new THREE.Mesh(new THREE.BoxGeometry(2,0.04,0.04), M.metal); cb.position.set(0,cy,-1); group.cascade1.add(cb);
  const cb2 = cb.clone(); cb2.position.z=1; group.cascade1.add(cb2);
}

/* =========================================================
   3. DATA CENTER LIQUID COOLING + PIEZOELECTRIC HARVESTING
   ========================================================= */
grp('server',-2,3.5,0);
{
  const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.6,2.2,1.8), M.glassDark); chassis.castShadow=true; group.server.add(chassis);
  const chassisFrame = new THREE.Mesh(new THREE.BoxGeometry(2.65,2.25,1.85), new THREE.MeshBasicMaterial({color:0x1e293b,wireframe:true})); group.server.add(chassisFrame);
  const coldplate = new THREE.Mesh(new THREE.BoxGeometry(1,0.3,1), M.copper); coldplate.position.y=0.3; coldplate.castShadow=true; group.server.add(coldplate);
  const finGeo = new THREE.BoxGeometry(0.95,0.55,0.055);
  for(let i=0;i<10;i++){const fin=new THREE.Mesh(finGeo,M.copper); fin.position.set(0,0.65,-0.44+i*0.1); fin.castShadow=true; group.server.add(fin);}
  const resistor = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,0.5,18), new THREE.MeshStandardMaterial({color:0xf59e0b, emissive:0xea580c, emissiveIntensity:0.6})); resistor.rotation.z=Math.PI/2; resistor.position.y=-0.4; resistor.castShadow=true; group.server.add(resistor);
  window._resistorMat = resistor.material;
  // ceramic ribbing on the resistor
  for(let i=0;i<6;i++){const rib=new THREE.Mesh(new THREE.TorusGeometry(0.36,0.015,8,20),new THREE.MeshStandardMaterial({color:0x78350f})); rib.rotation.y=Math.PI/2; rib.position.set(-0.35+i*0.14,-0.4,0); group.server.add(rib);}
  // server mesh rack detail behind coldplate
  for(let i=0;i<3;i++){const slot=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.06,0.9), M.darkMetal); slot.position.set(0,-0.9-i*0.25,0); group.server.add(slot);}
  // exhaust fan chassis with piezo discs mounted
  const fanChassis = new THREE.Mesh(new THREE.BoxGeometry(0.5,1.4,1.4), M.darkMetal); fanChassis.position.set(1.5,0.3,0); fanChassis.castShadow=true; group.server.add(fanChassis);
  const fanHub = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,0.1,20), M.metal); fanHub.rotation.z=Math.PI/2; fanHub.position.set(1.78,0.3,0); group.server.add(fanHub);
  window._fanHub = fanHub;
  for(let i=0;i<5;i++){
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.32,0.1), M.fanBlade);
    const a=(i/5)*Math.PI*2; blade.position.set(1.79, 0.3+Math.cos(a)*0.15, Math.sin(a)*0.15); blade.rotation.x=a; fanHub.add(blade);
  }
  // 4x 27mm brass-backed piezo discs on fan chassis
  const piezoPos = [[1.75,0.9,0.55],[1.75,0.9,-0.55],[1.75,-0.3,0.55],[1.75,-0.3,-0.55]];
  window._piezoDiscs=[];
  piezoPos.forEach(p=>{
    const backing = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,0.025,20), M.brass); backing.rotation.x=Math.PI/2; backing.position.set(...p); backing.castShadow=true; group.server.add(backing);
    const ceramic = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.03,20), new THREE.MeshStandardMaterial({color:0xfde68a,metalness:0.3,roughness:0.4})); ceramic.rotation.x=Math.PI/2; ceramic.position.set(p[0]+0.02,p[1],p[2]); group.server.add(ceramic);
    window._piezoDiscs.push(backing);
  });
  bolts(group.server,[[1.3,1.1,0.9],[1.3,1.1,-0.9],[1.3,-0.5,0.9],[1.3,-0.5,-0.9]]);
}
pipe([[-8,3.3,0],[-5,3.3,0.4],[-3.3,3.9,0]],0x38bdf8,0.06);
pipe([[-0.7,2.6,0],[1.5,2.0,0.6],[3,2.9,0]],0xef4444,0.06);

/* =========================================================
   4. CASCADE 2 — 2-TIER EFFLUENT MICRO-HYDRO TOWER
   ========================================================= */
grp('cascade2',3,5,0);
const c2wheels=[];
for(let i=0;i<2;i++){
  const tierY=-i*2.2;
  const w = makeWheel(0.7, 0xdc2626); w.position.set(0,tierY,0); group.cascade2.add(w); c2wheels.push(w);
  const motor = toyMotor(); motor.position.set(0.75,tierY,0.75); group.cascade2.add(motor);
  const tray = new THREE.Mesh(new THREE.CylinderGeometry(0.9,0.9,0.08,20,1,true), new THREE.MeshStandardMaterial({color:0x7f1d1d,side:THREE.DoubleSide,roughness:0.6}));
  tray.position.set(0,tierY-0.75,0); group.cascade2.add(tray);
  if(i<1){const chute = new THREE.Mesh(new THREE.ConeGeometry(0.35,0.5,12,1,true), new THREE.MeshStandardMaterial({color:0x7f1d1d,side:THREE.DoubleSide})); chute.position.set(0,tierY-0.9,0); group.cascade2.add(chute);}
}
[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([x,z])=>{const t=new THREE.Mesh(new THREE.BoxGeometry(0.08,5,0.08),M.metal); t.position.set(x,-2,z); t.castShadow=true; group.cascade2.add(t);});
for(let i=0;i<3;i++){const cy=-0.5-i*1.8; const cb=new THREE.Mesh(new THREE.BoxGeometry(2,0.04,0.04),M.metal); cb.position.set(0,cy,-1); group.cascade2.add(cb); const cb2=cb.clone(); cb2.position.z=1; group.cascade2.add(cb2);}

/* =========================================================
   6. WATER TREATMENT SKID — TRANSLUCENT CUTAWAYS
   ========================================================= */
grp('filtration',8,3.5,0);
function skidStand(x){
  const legGeo = new THREE.CylinderGeometry(0.03,0.03,1.4,8);
  [[-0.4,-0.4],[0.4,-0.4],[-0.4,0.4],[0.4,0.4]].forEach(([lx,lz])=>{
    const l = new THREE.Mesh(legGeo,M.metal); l.position.set(x+lx,-2,lz); group.filtration.add(l);
  });
}
function skidCyl(x,mat,h=2.6,r=0.6){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24),mat); m.position.set(x,0,0); m.castShadow=true; group.filtration.add(m);
  const capTop = new THREE.Mesh(new THREE.CylinderGeometry(r+0.05,r+0.05,0.08,24), M.darkMetal); capTop.position.set(x,h/2,0); group.filtration.add(capTop);
  const capBot = capTop.clone(); capBot.position.y=-h/2; group.filtration.add(capBot);
  skidStand(x);
  return m;
}
// Stage A — Activated Carbon Filter
const carbon = skidCyl(-2.5, M.glass);
const carbonCore = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,2.2,18), M.charcoal); carbonCore.position.x=-2.5; group.filtration.add(carbonCore);
const carbonPerf = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,2.3,14,1,true), new THREE.MeshStandardMaterial({color:0x475569,side:THREE.DoubleSide,wireframe:true})); carbonPerf.position.x=-2.5; group.filtration.add(carbonPerf);
// small granule specks
for(let i=0;i<40;i++){const g=new THREE.Mesh(new THREE.DodecahedronGeometry(0.04), M.charcoal); const a=Math.random()*Math.PI*2, r=0.2+Math.random()*0.25; g.position.set(-2.5+Math.cos(a)*r, -1+Math.random()*2, Math.sin(a)*r); group.filtration.add(g);}

// Stage B — Reverse Osmosis Chamber

/* =========================================================

   ========================================================= */
function makeStream(count,color,size){
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({color,size,transparent:true,opacity:0.9, blending:THREE.AdditiveBlending, depthWrite:false});
  const pts = new THREE.Points(geo,mat);
  pts.userData.t = new Float32Array(count).map(()=>Math.random());
  scene.add(pts);
  return pts;
}
const stream1 = makeStream(340,0x38bdf8,0.09); // Cascade 1 — fresh blue
const stream2 = makeStream(280,0xef4444,0.09); // Cascade 2 — warm effluent
const stream3 = makeStream(220,0x67e8f9,0.08); // UV exit — crystal cyan

/* =========================================================

function wire(points,color){
  const curve = new THREE.CatmullRomCurve3(points);
  const geo = new THREE.TubeGeometry(curve,44,0.03,6,false);
  const mat = new THREE.MeshBasicMaterial({color});
  const m = new THREE.Mesh(geo,mat); scene.add(m); return m;
}

function flyTo(p){
  const startPos = camera.position.clone(), startTgt = controls.target.clone();
  const endPos = new THREE.Vector3(...p.pos), endTgt = new THREE.Vector3(...p.tgt);
  const dur=60; let frame=0;
  function step(){
    frame++; const k = Math.min(frame/dur,1); const ek = 1-Math.pow(1-k,3);
    camera.position.lerpVectors(startPos,endPos,ek);
    controls.target.lerpVectors(startTgt,endTgt,ek);
    if(k<1) requestAnimationFrame(step);
  }
  step();
}

/* =========================================================
   HUD LOGIC — SLIDERS DRIVE THE PHYSICS MODEL
   ========================================================= */
const iIntake=document.getElementById('intake'), iThermal=document.getElementById('thermal'), iAcoustic=document.getElementById('acoustic');
const vIntake=document.getElementById('vIntake'), vThermal=document.getElementById('vThermal'), vAcoustic=document.getElementById('vAcoustic');
const tHydro=document.getElementById('tHydro'), tPiezo=document.getElementById('tPiezo'), tFiltration=document.getElementById('tFiltration'), tNet=document.getElementById('tNet');
function readHUD(){
  const intake=+iIntake.value, thermal=+iThermal.value, acoustic=+iAcoustic.value;
  vIntake.textContent=intake.toFixed(1)+' L/m'; vThermal.textContent=thermal+' W'; vAcoustic.textContent=acoustic+' dB';
  const hydro = intake*5*0.55;
  const piezo = Math.max(0,(acoustic-60))*0.045;
  const filtration = 8 + intake*3.5;
  const harvested = hydro+piezo;
  const net = ((harvested-filtration)/filtration*100);
  tHydro.textContent=hydro.toFixed(2)+' W';
  tPiezo.textContent=piezo.toFixed(2)+' W';
  tFiltration.textContent=filtration.toFixed(2)+' W';
  tNet.textContent=(net>=0?'+':'')+net.toFixed(0)+'%';
  tNet.style.color = net>=0 ? '#4ade80':'#f87171';
  if(window._resistorMat) window._resistorMat.emissiveIntensity = 0.2 + (thermal/1000)*1.2;
  return {intake,thermal,acoustic,hydro,piezo};
}
[iIntake,iThermal,iAcoustic].forEach(el=>el.addEventListener('input',readHUD));
let state = readHUD();

/* =========================================================
   ANIMATION LOOP
   ========================================================= */
const clock = new THREE.Clock();
function fallStream(pts,x,ytop,ybot,speedMul,jitterA=0.4,jitterB=0.4){
  const pos=pts.geometry.attributes.position.array,t=pts.userData.t;
  for(let i=0;i<t.length;i++){
    t[i]+=0.01*speedMul; if(t[i]>1)t[i]=0;
    pos[i*3]= x + Math.sin(i*12.9)*jitterA;
    pos[i*3+1]= ytop - t[i]*(ytop-ybot);
    pos[i*3+2]= Math.cos(i*7.1)*jitterB;
  }
  pts.geometry.attributes.position.needsUpdate=true;
}
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  state = readHUD();
  const speed = 0.3 + state.intake*0.3;
  c1wheels.forEach(w=>w.rotation.z -= speed*dt);
  c2wheels.forEach(w=>w.rotation.z -= speed*0.8*dt);
  roMem.rotation.y += dt*0.6;
  roSpiral.rotation.x = Math.PI/2; roSpiral.rotation.z += dt*0.6;
  if(window._fanHub) window._fanHub.rotation.x += dt*(2+state.thermal/300);
  if(window._piezoDiscs) window._piezoDiscs.forEach((d,i)=>{d.position.x = 1.75 + Math.sin(performance.now()*0.02 + i)*0.005*(state.acoustic/70);});

  fallStream(stream1,-8,9.5,0.5,(0.5+state.intake*0.4)*1.0);
  fallStream(stream2,3,6.5,0.0,(0.5+state.thermal/1000)*0.9);
  {
    const pos=stream3.geometry.attributes.position.array,t=stream3.userData.t;
    for(let i=0;i<t.length;i++){
      t[i]+=0.012; if(t[i]>1)t[i]=0;
      pos[i*3]= 10.5 + t[i]*3 + Math.sin(i*3.3)*0.15;
      pos[i*3+1]= 3.2 - Math.abs(Math.sin(t[i]*Math.PI))*0.3;
      pos[i*3+2]= Math.cos(i*4.4)*0.15;
    }
    stream3.geometry.attributes.position.needsUpdate=true;
  }

  if(window._pmsLed) window._pmsLed.material.color.setHex(Math.sin(performance.now()*0.006)>0 ? 0x22c55e : 0x064e3b);

  controls.update();
  updateLabels();
  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

document.getElementById('loading').style.display='none';
camBar.children[0].classList.add('active');
animate();
